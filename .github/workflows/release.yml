name: Release

on:
  push:
    tags: ['v[0-9]+.*']

permissions:
  contents: read

# Serialize retries for the same tag; never cancel an in-flight publication.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust and gate tools
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
      # Ubuntu apt is below the native version gate, so its AVIF tests disable
      # honestly. macOS must exercise AVIF; packaging builds pinned sources on
      # BOTH platforms and rejects missing native linkage/decoder smoke.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libavif-dev libdav1d-dev \
            libfontconfig1-dev libxcb1-dev libxkbcommon-dev libwayland-dev libdbus-1-dev
      - name: macOS prerequisites and required AVIF versions
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config libavif dav1d
          pkg-config --atleast-version=1.4.2 libavif
          pkg-config --atleast-version=1.5.4 dav1d
      - name: Validate tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(make -s version)"
      - name: Local gates on tagged commit
        run: |
          make verify
          make audit
          make machete

  package:
    needs: gate
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
      - name: macOS build prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config ninja nasm
          python3 -m pip install meson==1.12.1
      - name: Linux build prerequisites (native Ubuntu, no CI container)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates \
            curl cmake meson ninja-build pkg-config nasm patchelf desktop-file-utils \
            libfontconfig1-dev libxcb1-dev libxkbcommon-dev libwayland-dev libdbus-1-dev
      - name: macOS artifacts and smoke
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist evidence
          make bundle-avif
          make macos-artifacts
          make macos-smoke IMAGE="$PWD/assets/test/web/alpha12.avif" 2>&1 | tee evidence/macos-smoke.log
          smoke_dir=$(awk '/^Smoke evidence: / {print $3}' evidence/macos-smoke.log)
          cp "$smoke_dir"/*.log evidence/
          cp build/bundle-libs/{before,after,smoke,dyld,sizes,versions,minos,payload-sha256}.txt evidence/
          cp target/macos-artifacts/Glance-*.{zip,dmg,sha256} dist/
          name="Glance-$(make -s version)-macos-$(uname -m)"
          tar -czf "dist/$name-notices.tar.gz" -C build/notices .
          (cd dist && shasum -a 256 "$name-notices.tar.gz" > "$name-notices.sha256")
      - name: Linux AppImage, portable tarball, notices and smoke
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist evidence
          make appimage
          root="build/appimage-$(uname -m)"
          app="$root/Glance.AppDir"
          name="Glance-$(make -s version)-linux-$(uname -m)"
          image="Glance-$(make -s version)-$(uname -m).AppImage"
          GLANCE_SMOKE_IMAGE=1 "build/$image" --appimage-extract-and-run "$PWD/assets/test/web/alpha8.avif" | tee evidence/appimage-smoke.txt
          grep -Fx 'decoded 5x3' evidence/appimage-smoke.txt
          cp "$root"/{ldd,smoke,payload-sha256,needed-libavif.so.16,needed-libdav1d.so.7}.txt evidence/
          cp "build/$image" "build/$image.sha256" dist/
          # Portable AppRun payload with bundled AVIF, plus the tagged source
          # tree for make install-linux (source installation rebuilds locally).
          mkdir -p "$app/source"
          git archive HEAD | tar -x -C "$app/source"
          tar -czf "dist/$name.tar.gz" -C "$root" Glance.AppDir
          tar -czf "dist/$name-notices.tar.gz" -C "$app/usr/share/glance" notices licenses
          (cd dist && sha256sum "$name.tar.gz" "$name-notices.tar.gz" > "$name.sha256")
      - name: Archive smoke evidence (not a release asset)
        run: tar -czf smoke-evidence.tar.gz evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0 # payloads already compressed; never upload raw .app/binaries
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-evidence.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and report sizes
        run: |
          cd dist
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          {
            echo '## Release asset sizes (compressed; decimal MB)'
            echo '| Asset | Bytes | MB |'
            echo '| --- | ---: | ---: |'
            total=0
            for asset in *; do
              case "$asset" in
                *.zip|*.dmg|*.AppImage|*.tar.gz|*.sha256) ;;
                *) echo "Unexpected release asset: $asset" >&2; exit 1 ;;
              esac
              bytes=$(stat -c %s "$asset")
              total=$((total + bytes))
              awk -v name="$asset" -v bytes="$bytes" 'BEGIN {printf "| %s | %d | %.2f |\n", name, bytes, bytes/1000000}'
              if [[ "$asset" == *.dmg ]]; then
                if (( bytes >= 40000000 )); then
                  printf '\nOVER: %s (%s bytes); DMG target: under 40 MB.\n' "$asset" "$bytes"
                  echo "::warning::DMG meets or exceeds the 40 MB target: $asset ($bytes bytes)" >&2
                else
                  printf '\nPASS: %s (%s bytes); DMG target: under 40 MB.\n' "$asset" "$bytes"
                fi
              fi
            done
            printf '\nTotal upload: %s bytes. DMG target: under 40 MB.\n' "$total"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update GitHub Release and attach compressed assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Glance $RELEASE_TAG" \
              --notes 'Test-gated macOS and Linux artifacts with bundled decoder-only AVIF. macOS builds are ad-hoc signed, not Developer ID signed or notarized; see README for Gatekeeper instructions. EXR/HDR, PQ/HLG, XCF and AVIF/JXL sequences remain unsupported.'
            gh release view "$RELEASE_TAG" --json isDraft > release-state.json
          fi
          # Never turn an already-public release back into a draft on retry.
          was_draft=$(python3 -c 'import json; print(str(json.load(open("release-state.json"))["isDraft"]).lower())')
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python3 <<'PY'
          import json
          from pathlib import Path

          expected = {path.name: path.stat().st_size for path in Path("dist").iterdir()}
          assets = json.load(open("release-assets.json"))["assets"]
          actual = {asset["name"]: asset["size"] for asset in assets}
          if actual != expected or len(assets) != len(expected):
              raise SystemExit(f"Release asset mismatch: expected {expected}, got {actual}")
          print(f"Verified {len(expected)} uploaded assets and their byte sizes")
          PY
          # A failed upload or verification exits before this publication step.
          if [[ "$was_draft" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
