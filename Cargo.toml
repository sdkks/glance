[package]
name = "glance"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "An independently authored, image-first desktop viewer"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "=0.17.2"
