[package]
name = "glance"
version = "0.4.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "An independently authored, image-first desktop viewer"

[features]
default = ["avif-native"]
avif-native = []

[build-dependencies]
cc = "=1.7.0"
pkg-config = "=0.3.34"

[dependencies]
arboard = "=3.6.1"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "ico", "tga", "pnm", "gif", "webp"] }
webp-animation = { version = "=0.10.0", features = ["static"] }
image-extras = { version = "=0.1.1", default-features = false, features = ["icns", "wbmp", "xbm", "xpm", "pcx", "sgi"] }
resvg = { version = "=0.48.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
psd = "=0.3.5"
zip = { version = "=9.0.1", default-features = false, features = ["deflate"] }
flate2 = "=1.1.10"
roxmltree = "=0.21.1"
jxl-oxide = { version = "=0.12.6", default-features = false, features = ["moxcms"] }
moxcms = "=0.8.1"
half = "=2.7.1"
rfd = "=0.17.2"
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSWorkspace", "block2", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL", "NSBundle", "NSProcessInfo", "NSError", "NSAppleEventManager", "NSAppleEventDescriptor", "NSNotification", "objc2-core-services"] }
objc2-core-services = { version = "=0.3.2", default-features = false, features = ["std", "AE", "AEDataModel", "AppleEvents"] }
block2 = "=0.6.2"
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTType"] }
