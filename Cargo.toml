[package]
name = "glance"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "An independently authored, image-first desktop viewer"

[dependencies]
arboard = "=3.6.1"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
moxcms = "=0.8.1"
half = "=2.7.1"
rfd = "=0.17.2"
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL"] }
